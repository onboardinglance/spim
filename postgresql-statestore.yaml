apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: default
spec:
  type: state.postgresql
  version: v1
  metadata:
  - name: connectionString
    # value: |
    #   host=postgres-postgresql.infra.svc.cluster.local
    #   port=5432
    #   user=dapr
    #   password=StrongPassword123
    #   dbname=daprdb
    #   sslmode=disable
    secretKeyRef:
      name: postgres-secret
      key: connectionString
  # Alternatively, you can specify individual fields
  # - name: user
  #   value: "dapr"
  # - name: password
  #   secretKeyRef:
  #     name: postgres-secret
  #     key: password
# kubectl create secret generic postgres-secret --from-literal=connectionString="host=postgres-postgresql.infra.svc.cluster.local port=5432 user=dapr password=StrongPassword123 dbname=daprdb sslmode=disable"
auth:
  secretStore: kubernetes
