apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapr-demo-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dapr-demo
  template:
    metadata:
      labels:
        app: dapr-demo
# these annotations trigger the Dapr sidecar injection but only works if connected to internet
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "dapr-demo"
        dapr.io/app-port: "8080"
    spec:
      containers:
      - name: dapr-demo
        image: dapr-demo:latest
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_URLS
          value: "http://+:8080" # Listen on all network interfaces
        # API fetches signing keys over the cluster DNS; browsers (Scalar) use the port-forwarded URL
        - name: Keycloak__Authority
          value: "http://keycloak-service:8080/realms/demo"
        - name: Keycloak__PublicAuthority
          value: "http://localhost:8081/realms/demo"
        - name: Keycloak__RequireHttpsMetadata
          value: "false"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: spim-db-secret
              key: connectionString
        livenessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        imagePullPolicy: Always
        ports:
        - containerPort: 8080


---
apiVersion: v1
kind: Service
metadata:
  name: dapr-demo-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: dapr-demo
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080

